# Proposed security gates for the OptiView Cut 1 backend (Spring Boot 3.5, Java 21, Maven).
# Lives in the student fork as a proposal; it is not installed in the team code repository.
name: security

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (OWASP dependency-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fail on CVSS >= 7
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  authorization-tests:
    name: Negative authorization tests (#48)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Forged ADMIN token and unauthenticated access must fail
        run: mvn -B test -Dtest='JwtForgedAdminTokenNegativeTest,OptiviewIntegrationTest'
